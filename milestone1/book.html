<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Single Book – Open Library Edition</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f8; color: #222; margin: 0; }
  header, footer { background: #1f3a5f; color: #fff; padding: 1rem 2rem; }
  header a, footer a { color: #cfe3ff; }
  main { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.12); padding: 1.5rem; display: flex; gap: 1.5rem; flex-wrap: wrap; }
  .cover img { width: 200px; max-width: 100%; border-radius: 4px; border: 1px solid #ccc; }
  .details { flex: 1; min-width: 260px; }
  h1 { margin-top: 0; }
  dl { margin: 0; }
  dt { font-weight: bold; margin-top: .7rem; color: #1f3a5f; }
  dd { margin: .15rem 0 0 0; }
  .more { margin-top: 1.5rem; background: #fff; border-radius: 8px; padding: 1rem 1.5rem; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  .more ul { margin: .3rem 0; padding-left: 1.2rem; }
  a { color: #0b5cad; }
  .na { color: #777; font-style: italic; }
</style>
</head>
<body>
<header>
  <h2>Milestone 1: Single Book Record</h2>
  <a href="index.html">Back to Project Home</a>
</header>
<main id="content" aria-live="polite"><p>Loading book data…</p></main>
<footer>Data source: <a href="https://openlibrary.org/books/OL7353617M" target="_blank" rel="noopener">Open Library</a></footer>

<script>
$(function () {
  var NA = '<span class="na">Not available</span>';

  function val(v) {
    return (v === undefined || v === null || v === '') ? NA : $('<div>').text(v).html();
  }
  function list(arr) {
    if (!Array.isArray(arr) || arr.length === 0) { return NA; }
    var out = '<ul>';
    $.each(arr, function (i, item) { out += '<li>' + $('<div>').text(item).html() + '</li>'; });
    return out + '</ul>';
  }
  function row(label, html) { return '<dt>' + label + '</dt><dd>' + html + '</dd>'; }
  function dateOnly(d) { return d && d.value ? d.value.split('T')[0] : null; }

  $.getJSON('openlibrary-book.json')
    .done(function (b) {
      // Cover: use first valid (positive) id from the covers array
      var coverId = null;
      if (Array.isArray(b.covers)) {
        $.each(b.covers, function (i, id) { if (id > 0) { coverId = id; return false; } });
      }
      var title = b.title || 'Untitled';
      var cover = coverId
        ? '<img src="https://covers.openlibrary.org/b/id/' + coverId + '-L.jpg" alt="Front cover of ' + $('<div>').text(title).html() + '">'
        : '<p class="na">No cover available</p>';

      // Authors are only references (keys) in an edition record
      var authors = NA;
      if (Array.isArray(b.authors) && b.authors.length) {
        authors = '<ul>';
        $.each(b.authors, function (i, a) {
          authors += '<li><a href="https://openlibrary.org' + a.key + '" target="_blank" rel="noopener">Author record ' + a.key.replace('/authors/', '') + ' on Open Library</a></li>';
        });
        authors += '</ul>';
      }

      var langs = (b.languages || []).map(function (l) { return l.key.replace('/languages/', ''); });
      var works = NA;
      if (Array.isArray(b.works) && b.works.length) {
        works = '<ul>';
        $.each(b.works, function (i, w) {
          works += '<li><a href="https://openlibrary.org' + w.key + '" target="_blank" rel="noopener">Work record ' + w.key.replace('/works/', '') + '</a></li>';
        });
        works += '</ul>';
      }
      var ids = NA;
      if (b.identifiers) {
        ids = '<ul>';
        $.each(b.identifiers, function (name, values) { ids += '<li>' + name + ': ' + values.join(', ') + '</li>'; });
        ids += '</ul>';
      }
      var archive = b.ocaid
        ? '<a href="https://archive.org/details/' + b.ocaid + '" target="_blank" rel="noopener">View on the Internet Archive</a>'
        : NA;
      var olLink = b.key
        ? '<a href="https://openlibrary.org' + b.key + '" target="_blank" rel="noopener">View this edition on Open Library</a>'
        : NA;

      var html = '<section class="card"><div class="cover">' + cover + '</div><div class="details"><h1>' + $('<div>').text(title).html() + '</h1><dl>' +
        row('Publisher', list(b.publishers)) +
        row('Publication Date', val(b.publish_date)) +
        row('Page Count', val(b.number_of_pages)) +
        row('ISBN-10', list(b.isbn_10)) +
        row('ISBN-13', list(b.isbn_13)) +
        row('Author', authors) +
        row('Contributions', list(b.contributions)) +
        row('First Sentence', val(b.first_sentence && b.first_sentence.value)) +
        row('Language', langs.length ? val(langs.join(', ')) : NA) +
        row('Open Library Record', olLink) +
        '</dl></div></section>' +
        '<section class="more"><h2>Additional Metadata</h2><dl>' +
        row('Related Work', works) +
        row('External Identifiers', ids) +
        row('Internet Archive', archive) +
        row('Created', val(dateOnly(b.created))) +
        row('Last Modified', val(dateOnly(b.last_modified))) +
        row('Revision', val(b.revision)) +
        row('Cover IDs', list((b.covers || []).filter(function (c) { return c > 0; }).map(String))) +
        '</dl></section>';

      $('#content').html(html);
      document.title = title + ' – Open Library Edition';
    })
    .fail(function () {
      $('#content').html('<p>Sorry, the book data could not be loaded. Check that openlibrary-book.json is in the same folder as this page.</p>');
    });
});
</script>
</body>
</html>
